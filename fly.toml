# fly.toml app configuration file generated for freecodecamp-timestamp-microservice on 2024-10-09T17:30:47Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'freecodecamp-timestamp-microservice'
primary_region = 'gig'

[build]

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
